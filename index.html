:root{
  --bg:        #f5f3ee;
  --surface:   #ffffff;
  --surface-2: #eae6dd;
  --ink:       #211f1c;
  --ink-soft:  #6b665d;
  --line:      rgba(33,31,28,0.12);
  --accent:    #3c6e63;
  --accent-2:  #a98f4b;
  --accent-soft: rgba(60,110,99,0.12);

  --display: "GenSenRounded TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --body: "GenSenRounded TC", "PingFang TC", "Microsoft JhengHei", sans-serif;

  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:        #17181a;
    --surface:   #212224;
    --surface-2: #2a2b2d;
    --ink:       #ece9e2;
    --ink-soft:  #a7a39a;
    --line:      rgba(236,233,226,0.12);
    --accent:    #6fb3a3;
    --accent-2:  #d1b872;
    --accent-soft: rgba(111,179,163,0.16);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:        #17181a;
  --surface:   #212224;
  --surface-2: #2a2b2d;
  --ink:       #ece9e2;
  --ink-soft:  #a7a39a;
  --line:      rgba(236,233,226,0.12);
  --accent:    #6fb3a3;
  --accent-2:  #d1b872;
  --accent-soft: rgba(111,179,163,0.16);
}

*{box-sizing:border-box;}
[hidden]{display:none !important;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.corner-hex{
  position:fixed; top:-60px; right:-60px;
  width:260px; height:260px;
  opacity:0.5; z-index:0; pointer-events:none;
  color:var(--line);
}
@media (prefers-reduced-motion:no-preference){
  .stage{ animation: rise .4s ease both; }
  @keyframes rise{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
}

.wrap{
  position:relative; z-index:1;
  max-width:560px; margin:0 auto;
  padding-top: 28px;
  padding-bottom: 40px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  min-height:100svh;
  display:flex; flex-direction:column;
  gap:22px;
}

.eyebrow{
  font-family:var(--body); font-weight:700; font-size:14.5px;
  letter-spacing:0.14em; text-transform:uppercase;
  color:var(--accent);
  margin:0 0 10px;
}

.hero{
  text-align:center;
  position:relative; overflow:hidden;
  padding:40px 28px 32px;
  border-radius:28px;
  color:var(--ink);
  background:rgba(255,255,255,0.6);
  border:1px solid var(--line);
